[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nh-property-intelligence"
version = "0.1.0"
description = "Analytics platform for New Hampshire housing and property data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "dbt-snowflake>=1.8,<2.0",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "pdfplumber>=0.11,<1.0",
  "prefect>=3.0,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "snowflake-connector-python>=3.12,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nh_property_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "snowflake_integration: opt-in tests that require a configured Snowflake account",
]

[tool.ruff]
line-length = 100
target-version = "py311"
