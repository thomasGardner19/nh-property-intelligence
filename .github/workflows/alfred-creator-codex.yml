name: Alfred Creator - scoped Codex development

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Reviewed NHPI issue number (MVP allowlist: 18)'
        type: string
        required: true

run-name: "Alfred Creator: NHPI issue #${{ inputs.issue_number }}"
permissions:
  contents: read
concurrency:
  group: alfred-creator-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  codex:
    if: ${{ github.ref == 'refs/heads/main' && inputs.issue_number == '18' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      report_artifact_id: ${{ steps.report_upload.outputs.artifact-id }}
      source_artifact_id: ${{ steps.source_upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository without persistent GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare report helpers before model execution
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creator-tools"
          cp .github/alfred-creator/{pack_artifact,evidence}.py "$RUNNER_TEMP/creator-tools/"
      - name: Require reviewed task and Codex provider credential
        env:
          REVIEWED_ISSUE: ${{ inputs.issue_number }}
          CODEX_KEY_PRESENT: ${{ secrets.CODEX_CREATOR_API_KEY }}
        run: |
          set -euo pipefail
          test "$REVIEWED_ISSUE" = 18
          test -s .github/alfred-creator/task-18.txt
          if test -z "$CODEX_KEY_PRESENT"; then
            echo 'BLOCKED: CODEX_CREATOR_API_KEY is not configured' >&2
            exit 2
          fi
      - name: Codex implementation in restricted workspace
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.CODEX_CREATOR_API_KEY }}
          prompt-file: .github/alfred-creator/task-18.txt
          output-file: ${{ runner.temp }}/codex-final.txt
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
      - name: Package only Power BI source output
        run: |
          set -euo pipefail
          python3 -I -B "$RUNNER_TEMP/creator-tools/pack_artifact.py" pack "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nhpi-creator-18.zip"
      - name: Hand off untrusted source artifact only
        id: source_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nhpi-creator-18.zip
          if-no-files-found: error
          retention-days: 30
      - name: Collect bounded self-report as untrusted narrative
        id: report
        if: ${{ always() }}
        run: |
          python3 -I -B "$RUNNER_TEMP/creator-tools/evidence.py" report "$RUNNER_TEMP/codex-final.txt" "$RUNNER_TEMP/self-report.json"
      - name: Retain labeled self-report separately from trusted evidence
        id: report_upload
        if: ${{ always() && steps.report.outputs.report_available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-self-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/self-report.json
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate Creator source with read-only access
    needs: codex
    if: ${{ github.ref == 'refs/heads/main' && inputs.issue_number == '18' && needs.codex.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundle_artifact_id: ${{ steps.validated_upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.static.outputs.bundle_sha256 }}
      archive_policy: ${{ steps.static.outputs.archive_policy }}
      nonempty_changes: ${{ steps.static.outputs.nonempty_changes }}
      json_syntax: ${{ steps.static.outputs.json_syntax }}
    steps:
      - name: Fresh pinned checkout for trusted validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require one explicit producer artifact ID
        env:
          ARTIFACT_ID: ${{ needs.codex.outputs.source_artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]'
      - name: Download producer bundle by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.codex.outputs.source_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source
      - name: Trusted archive, change and JSON checks only
        id: static
        continue-on-error: true
        run: |
          python3 -I -B .github/alfred-creator/evidence.py validate "$RUNNER_TEMP/source/nhpi-creator-18.zip" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/validation.json"
      - name: Retain actual validation manifest and fixed checks
        if: ${{ always() && steps.static.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve exactly the validated bundle bytes
        id: validated_upload
        if: ${{ steps.static.outputs.validation == 'pass' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source/nhpi-creator-18.zip
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when trusted validation did not pass
        if: ${{ always() && steps.static.outputs.validation != 'pass' }}
        run: exit 1

  publish:
    name: Publish reviewed Creator result
    needs: [codex, validate]
    if: ${{ always() && github.ref == 'refs/heads/main' && inputs.issue_number == '18' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fresh trusted checkout - no model credentials
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze pinned publisher helpers before any artifact handling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publisher-tools"
          cp .github/alfred-creator/{pack_artifact,evidence}.py "$RUNNER_TEMP/publisher-tools/"
      - name: Require one explicit validated artifact ID
        if: ${{ needs.codex.result == 'success' && needs.validate.result == 'success' }}
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.bundle_artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]'
      - name: Receive validated bundle by trusted validator output ID
        if: ${{ needs.codex.result == 'success' && needs.validate.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.bundle_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/validated
      - name: Verify exact validated bytes and recheck path policy
        if: ${{ needs.codex.result == 'success' && needs.validate.result == 'success' }}
        env:
          BUNDLE_SHA256: ${{ needs.validate.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          python3 -I -B "$RUNNER_TEMP/publisher-tools/evidence.py" apply "$RUNNER_TEMP/validated/nhpi-creator-18.zip" "$GITHUB_WORKSPACE" "$BUNDLE_SHA256"
          if git status --porcelain --untracked-files=all | grep -vE '^(\?\?|[ MADRCU?!]{2}) powerbi/'; then
            echo 'REFUSED: unexpected changed path outside powerbi' >&2
            exit 1
          fi
      - name: Create draft PR only after trusted static validation
        id: pr
        if: ${{ success() && needs.codex.result == 'success' && needs.validate.result == 'success' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          base: main
          branch: alfred/creator-issue-18-${{ github.run_id }}-${{ github.run_attempt }}
          delete-branch: false
          draft: true
          add-paths: powerbi
          title: "Alfred Creator: credential-free PBIP starter (issue #18)"
          body: |
            Supervised Creator developer output for #18 (parent #17).
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Reviewed source SHA: ${{ github.sha }}
            Trusted checks passed: archive/path budget, nonempty changes, JSON syntax.
            These are transport and basic syntax checks, not PBIP acceptance tests.
            Generated code was NOT executed. Power BI Desktop was NOT tested.
            Ordinary downstream PR CI is NOT assumed: this PR uses GITHUB_TOKEN.
            The separately labeled creator-self-report artifact contains untrusted
            Codex narrative, not independently verified test results.
            No merge, deployment or Snowflake write is authorized.
            Owner and Alfred BA/PM/QA review are required.
      # draft:true only drafts newly created PRs. Never redraft a human-readied
      # PR; verify its actual state before claiming a draft in the result.
      - name: Verify actual open draft and exact repository refs
        id: verify_pr
        if: ${{ steps.pr.outcome == 'success' && steps.pr.outputs.pull-request-operation != 'closed' && (steps.pr.outputs.pull-request-number != '' || steps.pr.outputs.pull-request-url != '' || steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          python3 -I -B "$RUNNER_TEMP/publisher-tools/evidence.py" verify-pr
      - name: Build bounded result from trusted job and action outcomes
        id: result
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          GENERATION: ${{ needs.codex.result }}
          VALIDATOR_JOB: ${{ needs.validate.result }}
          ARCHIVE_POLICY: ${{ needs.validate.outputs.archive_policy }}
          NONEMPTY_CHANGES: ${{ needs.validate.outputs.nonempty_changes }}
          JSON_SYNTAX: ${{ needs.validate.outputs.json_syntax }}
          BUNDLE_SHA256: ${{ needs.validate.outputs.bundle_sha256 }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          PR_VERIFY_OUTCOME: ${{ steps.verify_pr.outcome }}
          PR_DRAFT_VERIFIED: ${{ steps.verify_pr.outputs.draft_verified }}
          REPORT_ARTIFACT_ID: ${{ needs.codex.outputs.report_artifact_id }}
        run: |
          python3 -I -B "$RUNNER_TEMP/publisher-tools/evidence.py" result "$RUNNER_TEMP/result/result.json"
      - name: Upload bounded trusted result independently of publication success
        id: result_upload
        if: ${{ always() && steps.result.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creator-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 30
      # GitHub's jobs API exposes this fixed publisher's successful step name.
      # The bridge must bind artifact ID AND JSON digest to this step, not trust
      # an artifact name supplied by any other job in the same run.
      - name: Creator result artifact ${{ steps.result_upload.outputs.artifact-id }} sha256 ${{ steps.result.outputs.sha256 }}
        if: ${{ always() && steps.result_upload.outcome == 'success' && steps.result.outcome == 'success' }}
        run: 'true'
