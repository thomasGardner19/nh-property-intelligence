services:
  refresh:
    build:
      context: .
      dockerfile: Dockerfile
    image: nh-property-intelligence:local
    env_file:
      - .env
      - .env.secrets
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "nh_property_intelligence.orchestration.refresh"]

  app:
    image: python:3.11-slim
    command: sleep infinity
    volumes:
      - .:/workspace
    working_dir: /workspace
    profiles: ["development"]
